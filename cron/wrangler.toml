name = "tomo-la-palabra-reloj"
main = "src/index.js"
compatibility_date = "2026-10-01"
workers_dev = false   # sin URL pública: solo corre por el cron

[vars]
GITHUB_REPO = "ramonzamora89/tomo-la-palabra"

# Un solo cron (el plan gratuito tiene pocos por cuenta): cada 30 min.
# Lanza Publish y Transcribe en cada tick (src/index.js).
[triggers]
crons = ["4,34 * * * *"]

[observability]
enabled = true
