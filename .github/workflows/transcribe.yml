name: Transcribe

# Watches Entrevistas for new videos: transcribes (Deepgram), drafts the
# note (Claude), and leaves a Google Doc in Borradores for editorial review.
on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

jobs:
  transcribe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - name: Run watchEntrevistas
        env:
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          DRIVE_FOLDER_ENTREVISTAS_ID: ${{ secrets.DRIVE_FOLDER_ENTREVISTAS_ID }}
          DRIVE_FOLDER_BORRADORES_ID: ${{ secrets.DRIVE_FOLDER_BORRADORES_ID }}
          DRIVE_FOLDER_PUBLICAR_ID: ${{ secrets.DRIVE_FOLDER_PUBLICAR_ID }}
          DRIVE_FOLDER_ARCHIVO_ID: ${{ secrets.DRIVE_FOLDER_ARCHIVO_ID }}
          DRIVE_LEDGER_SHEET_ID: ${{ secrets.DRIVE_LEDGER_SHEET_ID }}
        run: npm run pipeline:watch-entrevistas
