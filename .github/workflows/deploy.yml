name: Deploy

# Deploy is orchestrated from GitHub Actions (not Vercel's native git
# integration) so the hosting target can move later (e.g. to AWS) by
# swapping only this job — see the plan for why.
on:
  push:
    branches: [main]
  # Pushes made with the default GITHUB_TOKEN (e.g. from Publish) don't
  # trigger `on: push` workflows — GitHub's own loop-prevention rule. Chain
  # off Publish's completion instead so publishing a note still deploys.
  workflow_run:
    workflows: ["Publish"]
    types: [completed]
  workflow_dispatch:

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      # Publish runs on a 15-min cron and completes successfully even when
      # there's nothing new to publish, which used to trigger a real
      # `vercel deploy` every time via workflow_run below — burning through
      # Vercel's free-tier upload quota (5000/day) with same-commit
      # redeploys. Skip the deploy entirely when this commit is already
      # live in production.
      - name: Check if this commit is already deployed
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Un deploy pedido a mano (workflow_dispatch) siempre debe correr:
          # es la única forma de recoger cambios que no viven en el commit,
          # como variables de entorno nuevas en Vercel. Además, `vercel deploy
          # --prebuilt` produce deployments que Vercel se niega a redesplegar
          # desde su dashboard ("Prebuilt deployments cannot be redeployed"),
          # así que sin esta salida no habría ninguna manera de forzarlo.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Deploy manual: se omite el chequeo de deduplicación."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          LATEST_SHA=$(curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&target=production&limit=1&state=READY" \
            | jq -r '.deployments[0].meta.githubCommitSha // empty' || echo "")
          echo "Commit a desplegar: $SHA"
          echo "Último deploy en producción: ${LATEST_SHA:-<no se pudo determinar>}"
          if [ -n "$LATEST_SHA" ] && [ "$SHA" = "$LATEST_SHA" ]; then
            echo "Ya está desplegado, se omite el build/deploy."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 20

      - run: npm ci
        if: steps.check.outputs.skip != 'true'

      - name: Deploy to Vercel (production)
        if: steps.check.outputs.skip != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          npx vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
