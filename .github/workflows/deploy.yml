name: Deploy

# Deploy is orchestrated from GitHub Actions (not Vercel's native git
# integration) so the hosting target can move later (e.g. to AWS) by
# swapping only this job — see the plan for why.
on:
  push:
    branches: [main]
  # Publish lo lanza con workflow_dispatch (forzar=false) solo cuando empujó
  # una nota o se cumplió un embargo. Antes Deploy escuchaba `workflow_run`
  # de cada Publish, y en repo privado cada una de esas corridas vacías
  # contaba como un minuto de Actions. Un push hecho con el GITHUB_TOKEN no
  # dispara `on: push` (regla anti-loop de GitHub), pero workflow_dispatch sí.
  workflow_dispatch:
    inputs:
      forzar:
        description: "Desplegar aunque el commit ya esté en producción (deploy manual)"
        type: boolean
        default: true

# Deploys en fila: si dos corren a la vez, el de un commit más viejo puede
# terminar último y dejarlo en producción.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No reconstruir un commit que ya está en producción (un push que no
      # cambia nada, o un Publish que se cruzó con otro deploy). La lógica,
      # embargos incluidos, vive en scripts/necesita-deploy.sh.
      - name: Check if this commit is already deployed
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Un deploy pedido a mano siempre debe correr: es la única forma de
          # recoger cambios que no viven en el commit, como variables de
          # entorno nuevas en Vercel. Además, `vercel deploy --prebuilt`
          # produce deployments que Vercel se niega a redesplegar desde su
          # dashboard ("Prebuilt deployments cannot be redeployed").
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.forzar }}" != "false" ]; then
            echo "Deploy manual: se omite el chequeo de deduplicación."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          RESP=$(bash scripts/necesita-deploy.sh)
          echo "$RESP"
          if [ "$(echo "$RESP" | tail -1)" = "no" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != 'true'
        with:
          node-version: 20

      # Reintentos: npm ci baja el binario de ffmpeg-static desde GitHub
      # Releases, que a veces responde 504 (5-nov-2026).
      - name: Install dependencies (con reintentos)
        if: steps.check.outputs.skip != 'true'
        run: |
          for i in 1 2 3; do
            npm ci && break
            [ "$i" -eq 3 ] && exit 1
            echo "npm ci falló (intento $i), reintentando en 30 s"; sleep 30
          done

      - name: Deploy to Vercel (production)
        if: steps.check.outputs.skip != 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          # Lo lee el chequeo de embargos del próximo deploy: una nota cuya
          # hora pasó después de este momento no entró en este build.
          BUILD_STARTED_AT=$(( $(date +%s) * 1000 ))
          npx vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx vercel build --prod --token="$VERCEL_TOKEN"
          # --archive=tgz sube el build como un solo archivo. Sin esto, cada
          # archivo de .vercel/output cuenta contra el límite de 5000 subidas
          # diarias del plan gratuito (api-upload-free), que se agotó con
          # unos pocos deploys el 2026-08-09 y otra vez el 2026-10-08.
          npx vercel deploy --prebuilt --prod --archive=tgz --meta buildStartedAt="$BUILD_STARTED_AT" --token="$VERCEL_TOKEN"
